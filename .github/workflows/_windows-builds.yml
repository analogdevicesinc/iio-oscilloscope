name: Windows builds

# Reusable: msys2/UCRT64 build on the runner. libiio, libad9361, libad9166 and
# gtkdatabox are all built from source into /ucrt64 by build_mingw.sh, so Windows
# needs no Cloudsmith fetch (the MSVC Cloudsmith zip ships no pkg-config .pc that
# a mingw build could use). Produces a build/ tree.

on:
  workflow_call:
    inputs:
      build-type:
        required: true
        type: string
    secrets:
      CLOUDSMITH_API_KEY:
        required: false

jobs:
  windows:
    name: Windows-mingw-x64
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2 # TODO: pin to a commit SHA
        with:
          msystem: MINGW64
          update: true
          install: base-devel git wget unzip

      - name: Build osc
        shell: msys2 {0}
        run: bash ./CI/docker/build_mingw.sh build_osc_github

      - name: Upload build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Windows-mingw-x64
          path: build/
          if-no-files-found: error
