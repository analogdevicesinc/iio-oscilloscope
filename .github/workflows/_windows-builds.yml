name: Windows builds

# Reusable: msys2/MINGW64 build on the runner (replaces the prebuilt
# shooteu/iio-oscilloscope image). Reuses CI/docker/build_mingw.sh to build osc,
# which expects the source under /home/docker/iio-oscilloscope. Produces a
# build/ tree.
#
# TODO: libiio/libad9361/libad9166 are not built yet (build_libiio/libad9361/
# libad9166 skipped) - the osc build will fail to link until dependency handling
# is added; InnoSetup packaging (adi-osc-setup.exe) is deferred until then.

on:
  workflow_call:
    inputs:
      build-type:
        required: true
        type: string

jobs:
  windows:
    name: Windows-mingw-x64
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2 # TODO: pin to a commit SHA
        with:
          msystem: MINGW64
          update: true
          install: base-devel git wget

      - name: Build osc
        shell: msys2 {0}
        run: |
          set -e
          export USER=docker
          src="$(cygpath "$GITHUB_WORKSPACE")"
          mkdir -p /home/docker
          cp -r "$src" /home/docker/iio-oscilloscope
          cd /home/docker/iio-oscilloscope
          git config --global --add safe.directory /home/docker/iio-oscilloscope
          bash ./CI/docker/build_mingw.sh install_pacman_deps
          bash ./CI/docker/build_mingw.sh build_gtkdatabox
          bash ./CI/docker/build_mingw.sh build_osc
          cp -r build "$src/"

      - name: Upload build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Windows-mingw-x64
          path: build/
          if-no-files-found: error
