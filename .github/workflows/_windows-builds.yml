name: Windows builds

# Reusable: msys2/MINGW64 build on the runner. libiio is fetched prebuilt from
# Cloudsmith (same approach as the libad9166-iio example); libad9361/libad9166 are
# added separately. gtkdatabox is built from source. Produces a build/ tree.
#
# NOTE: the Cloudsmith package must be a mingw-compatible build; the layout it
# unzips into /mingw64 is verified on the first real run.

on:
  workflow_call:
    inputs:
      build-type:
        required: true
        type: string
    secrets:
      CLOUDSMITH_API_KEY:
        required: true

jobs:
  windows:
    name: Windows-mingw-x64
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Get libiio from Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/analogdevicesinc/wiki-scripts/8d7a96779dd034005279ed1c7d052514df695d8c/utils/cloudsmith_utils/cloudsmith_helper.py" `
            -OutFile "$env:TEMP\cloudsmith_helper.py"
          if (!(Test-Path build)) { mkdir build }
          cd build
          foreach ($dep in @(
            @{ repo = 'test-alin-repo'; version = 'test9361-v0';                 package = 'Windows-VS-2022-x64.zip' }
            @{ repo = 'test-alin-repo'; version = 'test-v0';                     package = 'Windows-VS-2022-x64.zip' }
            @{ repo = 'external';       version = 'libiio-v0~latest';            package = 'Windows-VS-2022-x64.zip' }
          )) {
            python "$env:TEMP\cloudsmith_helper.py" `
              --method get_artifacts_from_location `
              --repo $dep.repo `
              --package_version $dep.version `
              --package_name $dep.package
            7z e $dep.package -o"." -y
          }

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2 # TODO: pin to a commit SHA
        with:
          msystem: MINGW64
          update: true
          install: base-devel git wget unzip

      - name: Build osc
        shell: msys2 {0}
        run: bash ./CI/docker/build_mingw.sh build_osc_github

      - name: Upload build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Windows-mingw-x64
          path: build/
          if-no-files-found: error
