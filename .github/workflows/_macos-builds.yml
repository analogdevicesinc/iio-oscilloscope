name: macOS builds

# Reusable: reuses CI/azure/build_osc_darwin.sh for deps + build (same pattern as
# the Linux/ARM jobs). ADI deps (libiio/libad9361/libad9166) come from Cloudsmith
# via the get-adi-deps action, like the libad9166-iio example. Produces a build/
# tree.
#
# continue-on-error: macOS still needs the OSC_FALLTHROUGH / CMakeLists source
# fixes (removed from this CI-only branch) to compile under Apple's toolchain.

on:
  workflow_call:
    inputs:
      build-type:
        required: true
        type: string
    secrets:
      CLOUDSMITH_API_KEY:
        required: true

jobs:
  macos:
    name: ${{ matrix.artifact-name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact-name: macOS-15-arm64
          - os: macos-15-large
            artifact-name: macOS-15-x64
          - os: macos-26
            artifact-name: macOS-26-arm64
          - os: macos-26-large
            artifact-name: macOS-26-x64
    env:
      ARTIFACTNAME: ${{ matrix.artifact-name }}
      CMAKE_BUILD_TYPE: ${{ inputs.build-type }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Get ADI dependencies from Cloudsmith
        uses: ./.github/actions/get-adi-deps
        with:
          cloudsmith-api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          package-name: ${{ matrix.artifact-name }}.pkg
          python: python3

      - name: Install dependencies
        run: |
          bash ./CI/azure/build_osc_darwin.sh install_deps
          bash ./CI/azure/build_osc_darwin.sh install_adi_pkgs

      - name: Build osc
        run: bash ./CI/azure/build_osc_darwin.sh build_osc

      - name: Upload build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: build/
          if-no-files-found: warn
