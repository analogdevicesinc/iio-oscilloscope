name: Linux builds

on:
  workflow_call:
    inputs:
      build-type:
        required: true
        type: string
    secrets:
      CLOUDSMITH_API_KEY:
        required: true

jobs:
  linux:
    name: ${{ matrix.artifact-name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            artifact-name: Linux-Ubuntu-22.04
            build-script: ci-linux.sh
            os-type: default
            package-type: deb
          - image: ubuntu:24.04
            artifact-name: Linux-Ubuntu-24.04
            build-script: ci-linux.sh
            os-type: default
            package-type: deb
          - image: debian:bookworm
            artifact-name: Linux-Debian-12
            build-script: ci-linux.sh
            os-type: default
            package-type: deb
          - image: debian:trixie
            artifact-name: Linux-Debian-13
            build-script: ci-linux.sh
            os-type: default
            package-type: deb
    defaults:
      run:
        shell: /bin/bash -eo pipefail {0}
    container:
      image: ${{ matrix.image }}
    env:
      CMAKE_BUILD_TYPE: ${{ inputs.build-type }}
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Installing dependencies
        shell: sh {0}
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y sudo build-essential git wget curl ca-certificates \
          python3 python3-requests
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Install dependencies
        run: ./CI/build_osc_ubuntu.sh install_deps

      - name: Get libiio and libads from Cloudsmith
        uses: ./.github/actions/get-adi-deps
        with:
          cloudsmith-api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          package-versions: "libiio-v0~latest libad9361-v0~latest libad9166-v0~latest"
          package-name: ${{ matrix.artifact-name }}.${{ matrix.package-type }}
          python: python3

      - name: Install ADI dependencies
        run: ./CI/build_osc_ubuntu.sh install_adi_pkgs

      - name: Build gtkdatabox
        run: ./CI/build_osc_ubuntu.sh install_gtkdatabox

      - name: Build osc
        run: ./CI/build_osc_ubuntu.sh build_osc

      - name: Upload build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: build/
          if-no-files-found: error
