name: Linux Builds

on:
  workflow_dispatch:
    inputs:
      build-type:
        required: false
        type: string
        default: RelWithDebInfo
  workflow_call:
    inputs:
      build-type:
        required: true
        type: string

jobs:
  linux:
    name: ${{ matrix.artifact-name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            artifact-name: Linux-Ubuntu-22.04
            pm: apt
          - image: ubuntu:24.04
            artifact-name: Linux-Ubuntu-24.04
            pm: apt
          - image: ubuntu:26.04
            artifact-name: Linux-Ubuntu-26.04
            pm: apt
          - image: debian:bookworm
            artifact-name: Linux-Debian-12
            pm: apt
          - image: debian:trixie
            artifact-name: Linux-Debian-13
            pm: apt
          - image: fedora:42
            artifact-name: Linux-Fedora-42
            pm: fedora
          - image: fedora:44
            artifact-name: Linux-Fedora-44
            pm: fedora
          - image: opensuse/leap:15.6
            artifact-name: Linux-openSUSE-15.6
            pm: opensuse
          - image: opensuse/leap:16.0
            artifact-name: Linux-openSUSE-16.0
            pm: opensuse
    container:
      image: ${{ matrix.image }}
    env:
      CMAKE_BUILD_TYPE: ${{ inputs.build-type }}
    steps:
      - name: Install base packages
        run: |
          set -e
          # Full per-distro build dependency set (single source of truth). Also
          # includes git (checkout) and wget/python3/python3-requests/ca-certificates
          # (used by the Cloudsmith step). gtkdatabox is built from source in every
          # case; matio is built from source on openSUSE (no matio-devel in Leap).
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y \
              sudo build-essential git cmake wget curl ca-certificates \
              python3 python3-requests autoconf automake libtool autotools-dev \
              bison flex libglib2.0-dev libgtk-3-dev libmatio-dev libfftw3-dev \
              libxml2-dev libavahi-common-dev libavahi-client-dev \
              libcurl4-openssl-dev libjansson-dev libaio-dev libserialport-dev \
              libcdk5-dev libusb-1.0-0-dev
          elif command -v dnf >/dev/null; then
            dnf install -y \
              gcc gcc-c++ make cmake git flex bison rpm-build \
              autoconf automake libtool pkgconf-pkg-config patch wget tar \
              ca-certificates python3 python3-requests \
              glib2-devel gtk3-devel fftw-devel libxml2-devel libcurl-devel \
              jansson-devel matio-devel libserialport-devel libusbx-devel \
              libaio-devel avahi-devel cdk-devel
          elif command -v zypper >/dev/null; then
            zypper --gpg-auto-import-keys ref
            # Leap 15.6's base python3 is 3.6, too old to parse
            # cloudsmith_helper.py (walrus operator -> needs 3.8+). Pull
            # python3.11 (python311) on both Leap images and run the helper
            # with it; see the Cloudsmith step.
            zypper in -y --allow-downgrade \
              gcc gcc-c++ make cmake git flex bison rpm-build \
              autoconf automake libtool pkg-config patch wget tar \
              ca-certificates python3 python3-requests python311 python311-requests \
              glib2-devel gtk3-devel fftw3-devel libxml2-devel libcurl-devel \
              libjansson-devel zlib-devel libserialport-devel libusb-1_0-devel \
              libaio-devel libavahi-devel cdk-devel
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Get ADI dependencies from Cloudsmith
        env:
          # TODO switch secret to CLOUDSMITH_API_KEY
          CLOUDSMITH_API_KEY: ${{ secrets.TEST_REPO_CLOUDSMITH_TOKEN }}
        run: |
          set -e
          # apt distros pull .deb; RPM distros (Fedora/openSUSE) pull .rpm.
          if [ "${{ matrix.pm }}" = "apt" ]; then EXT=deb; else EXT=rpm; fi
          wget -q https://raw.githubusercontent.com/analogdevicesinc/wiki-scripts/refs/heads/main/utils/cloudsmith_utils/cloudsmith_helper.py \
            -O /tmp/cloudsmith_helper.py
          mkdir -p download && cd download
          # cloudsmith_helper.py uses the walrus operator (needs Python 3.8+);
          # openSUSE Leap 15.6's default python3 is 3.6. Prefer python3.11 when
          # present (installed via python311 on the Leap images); python3
          # everywhere else is already >= 3.8.
          PY=python3
          if command -v python3.11 >/dev/null 2>&1; then PY=python3.11; fi
          # libiio from external; libad9361/libad9166 from the test repo.
          # TODO(production): --repo adi/external and *-v0~latest versions
          "$PY" /tmp/cloudsmith_helper.py \
              --method get_artifacts_from_location \
              --repo external \
              --package_version "libiio-v0~latest" \
              --package_name "${{ matrix.artifact-name }}.$EXT"
          "$PY" /tmp/cloudsmith_helper.py \
              --method get_artifacts_from_location \
              --repo adi/test-alin-repo \
              --package_version "test9361-v0" \
              --package_name "${{ matrix.artifact-name }}.$EXT"
          "$PY" /tmp/cloudsmith_helper.py \
              --method get_artifacts_from_location \
              --repo adi/test-alin-repo \
              --package_version "test-v0" \
              --package_name "${{ matrix.artifact-name }}.$EXT"

      - name: Install dependencies and build
        run: |
          set -e
          # Build deps are already installed (Install base packages); the ADI libs
          # were downloaded to download/ (Get ADI dependencies from Cloudsmith).
          if [ "${{ matrix.pm }}" = "apt" ]; then
            ./CI/build_osc_ubuntu.sh install_adi_debs
            ./CI/build_osc_ubuntu.sh install_gtkdatabox
            ./CI/build_osc_ubuntu.sh build_osc
          else
            # Carried into the package filename via CPack (see CI/build_osc_rpm.sh).
            export CPACK_SYSTEM_NAME="${{ matrix.artifact-name }}"
            chmod +x ./CI/build_osc_rpm.sh
            ./CI/build_osc_rpm.sh install_adi_rpms
            if [ "${{ matrix.pm }}" = "opensuse" ]; then
              ./CI/build_osc_rpm.sh install_matio
            fi
            ./CI/build_osc_rpm.sh install_gtkdatabox
            ./CI/build_osc_rpm.sh build_osc
          fi

      - name: Upload packages (Fedora/openSUSE)
        if: matrix.pm != 'apt'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}-pkg
          path: |
            build/*.rpm
            build/*.tar.gz
          if-no-files-found: error

      - name: Upload build tree (on failure, for debugging)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: build/
          if-no-files-found: ignore

  appimage-x86_64:
    name: osc-linux-x86_64-${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          set-safe-directory: 'true'
          fetch-depth: 0

      - name: Install dependencies
        run: |
          ./CI/appimage_x86_64/install_deps.sh \
            install_apt_pkgs install_gtkdatabox install_libserialport \
            install_libiio install_libad9361 install_libad9166

      - name: Create Osc AppImage
        shell: bash
        run: |
          ./CI/appimage_x86_64/build_osc.sh
          ./CI/appimage_x86_64/create_appimage.sh get_tools create_appdir create_appimage move_appimage

      - name: Set short git commit SHA
        shell: bash
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          echo "commit_sha=$(git rev-parse --short ${{ github.sha }})" >> "$GITHUB_ENV"

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osc-linux-x86_64-${{ matrix.runner }}-${{ env.commit_sha }}
          path: ${{ github.workspace }}/ADI_IIO_Oscilloscope-x86_64.AppImage