name: ARM builds

# Reusable: modelled on libad9166-iio's _arm-builds.yml.
#   arm-native: arm64 / arm32v7 on a native ARM runner (arm32 via docker --platform)
#   cross-arch: s390x under QEMU (no ppc64le - dropped)
# ADI deps (libiio/libad9361/libad9166) come from Cloudsmith via the get-adi-deps
# action and are installed inside the target container; osc is built with
# CI/azure/build_osc_arm.sh. Produces a build/ tree.

on:
  workflow_call:
    inputs:
      build-type:
        required: true
        type: string
    secrets:
      CLOUDSMITH_API_KEY:
        required: true

jobs:
  arm-native:
    name: ${{ matrix.artifact-name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            platform-flag: ''
            artifact-name: Ubuntu-22.04-arm64v8
          - image: arm32v7/ubuntu:22.04
            platform-flag: '--platform linux/arm/v7'
            artifact-name: Ubuntu-22.04-arm32v7

          - image: ubuntu:26.04
            platform-flag: ''
            artifact-name: Ubuntu-26.04-arm64v8
          - image: arm32v7/ubuntu:26.04
            platform-flag: '--platform linux/arm/v7'
            artifact-name: Ubuntu-26.04-arm32v7

          - image: debian:bookworm
            platform-flag: ''
            artifact-name: Debian-12-arm64
          - image: arm32v7/debian:bookworm
            platform-flag: '--platform linux/arm/v7'
            artifact-name: Debian-12-armhf

          - image: docker.cloudsmith.io/adi/containers/kuiper_basic_64@sha256:2a4b203ca34cf660339f8d8a5b32d290ae3c4918e18c0473902e2c12c86ca129
            platform-flag: ''
            artifact-name: Debian-13-arm64
          - image: docker.cloudsmith.io/adi/containers/kuiper_basic_32@sha256:ce9c5eba9dc120595e42142665aa11ded7317181c01c14c190e86835cfef9c8a
            platform-flag: '--platform linux/arm/v7'
            artifact-name: Debian-13-armhf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Setup Python venv and install requests
        run: |
          set -e
          uv python install 3.11
          uv venv --python 3.11 /tmp/cloudsmith-venv --seed
          uv pip install --python /tmp/cloudsmith-venv/bin/python3 requests

      - name: Get libiio from Cloudsmith
        uses: ./.github/actions/get-adi-deps
        with:
          cloudsmith-api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          package-versions: libiio-v0~latest
          package-name: ${{ matrix.artifact-name }}.deb
          python: /tmp/cloudsmith-venv/bin/python3

      - name: Get libads from Cloudsmith
        uses: ./.github/actions/get-adi-deps
        with:
          cloudsmith-api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          repo: test-alin-repo
          package-versions: test9361-v0 test-v0
          package-name: ${{ matrix.artifact-name }}.deb
          python: /tmp/cloudsmith-venv/bin/python3
      - name: Get libads from Cloudsmith
        continue-on-error: true
        uses: ./.github/actions/get-adi-deps
        with:
          cloudsmith-api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          repo: test-alin-repo
          package-versions: test-v0 
          package-name: ${{ matrix.artifact-name }}.deb  
          python: /tmp/cloudsmith-venv/bin/python3

      - name: Build
        run: |
          set -e
          docker run ${{ matrix.platform-flag }} --rm -t --privileged \
            -e DEBIAN_FRONTEND=noninteractive \
            -e CMAKE_BUILD_TYPE=${{ inputs.build-type }} \
            -v "${{ github.workspace }}":/ci \
            "${{ matrix.image }}" \
            /bin/bash -c '
              set -e
              apt-get update
              apt-get install -y sudo build-essential git wget curl ca-certificates
              cd /ci
              bash ./CI/azure/build_osc_arm.sh install_apt_pkgs
              bash ./CI/azure/build_osc_arm.sh install_gtkdatabox
              bash ./CI/azure/build_osc_arm.sh install_adi_debs
              bash ./CI/azure/build_osc_arm.sh build_osc
            '

      - name: Upload build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: build/
          if-no-files-found: error

  cross-arch:
    name: ${{ matrix.artifact-name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            arch: s390x
            artifact-name: Ubuntu-22.04-s390x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Setup Python venv and install requests
        run: |
          set -e
          uv python install 3.11
          uv venv --python 3.11 /tmp/cloudsmith-venv --seed
          uv pip install --python /tmp/cloudsmith-venv/bin/python3 requests

      - name: Get libiio from Cloudsmith
        uses: ./.github/actions/get-adi-deps
        with:
          cloudsmith-api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          package-versions: libiio-v0~latest
          package-name: ${{ matrix.artifact-name }}.deb
          python: /tmp/cloudsmith-venv/bin/python3

      - name: Get libads from Cloudsmith
        continue-on-error: true
        uses: ./.github/actions/get-adi-deps
        with:
          cloudsmith-api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          repo: test-alin-repo
          package-versions: test9361-v0 test-v0
          package-name: ${{ matrix.artifact-name }}.deb
          python: /tmp/cloudsmith-venv/bin/python3

      - name: Build
        run: |
          set -e
          docker run --platform "linux/${{ matrix.arch }}" --rm -t --privileged \
            -e DEBIAN_FRONTEND=noninteractive \
            -e CMAKE_BUILD_TYPE=${{ inputs.build-type }} \
            -v "${{ github.workspace }}":/ci \
            "${{ matrix.image }}" \
            /bin/bash -c '
              set -e
              apt-get update
              apt-get install -y sudo build-essential git wget curl ca-certificates
              cd /ci
              bash ./CI/azure/build_osc_arm.sh install_apt_pkgs
              bash ./CI/azure/build_osc_arm.sh install_gtkdatabox
              bash ./CI/azure/build_osc_arm.sh install_adi_debs
              bash ./CI/azure/build_osc_arm.sh build_osc
            '

      - name: Upload build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: build/
          if-no-files-found: error
