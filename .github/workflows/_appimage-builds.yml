name: AppImage build

on:
  workflow_call:
    secrets:
      CLOUDSMITH_API_KEY:
        required: true

jobs:
  appimage:
    name: Linux-x86_64-AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Get libiio and libads from Cloudsmith
        uses: ./.github/actions/get-adi-deps
        with:
          cloudsmith-api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          package-versions: "libiio-v0~latest libad9361-v0~latest libad9166-v0~latest"
          package-name: Linux-Ubuntu-22.04.deb
          python: python3

      - name: Install dependencies
        run: |
          ./CI/appimage_x86_64/install_deps.sh \
            install_apt_pkgs install_gtkdatabox install_libserialport
          sudo apt install -y "$GITHUB_WORKSPACE/download/"*.deb

      - name: Build osc
        run: ./CI/appimage_x86_64/build_osc.sh

      - name: Create AppImage
        run: |
          ./CI/appimage_x86_64/create_appimage.sh \
            get_tools create_appdir create_appimage move_appimage

      - name: Upload AppImage
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Linux-x86_64-AppImage
          path: ADI_IIO_Oscilloscope-x86_64.AppImage
          if-no-files-found: error

  appimage-arm:
    name: ${{ matrix.artifact-name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: arm64v8/debian:trixie
            arch: aarch64
            platform-flag: ''
            deb-name: Debian-13-arm64.deb
            artifact-name: Linux-aarch64-AppImage
          - image: arm32v7/debian:trixie
            arch: armhf
            platform-flag: '--platform linux/arm/v7'
            deb-name: Debian-13-armhf.deb
            artifact-name: Linux-armhf-AppImage
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: iio-oscilloscope

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Get libiio and libads from Cloudsmith
        uses: ./iio-oscilloscope/.github/actions/get-adi-deps
        with:
          cloudsmith-api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          package-versions: "libiio-v0~latest libad9361-v0~latest libad9166-v0~latest"
          package-name: ${{ matrix.deb-name }}
          python: python3

      - name: Build AppImage and Debian package
        run: |
          docker run ${{ matrix.platform-flag }} --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/iio-oscilloscope \
            "${{ matrix.image }}" \
            /bin/bash -c '
              set -e
              apt-get update
              apt-get install -y /workspace/download/*.deb
              ./CI/setup_and_build.sh ${{ matrix.arch }}
            '

      - name: Upload build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            iio-oscilloscope-${{ matrix.arch }}.AppImage
            iio-oscilloscope_*
          if-no-files-found: error
