name: AppImage build

# Reusable: x86_64 AppImage on a bare ubuntu-22.04 runner (replaces the
# prebuilt cristianbindea/osc-ubuntu20 image). install_deps.sh builds the ADI
# libs from source into /usr/local/lib, which the packaging script relies on.

on:
  workflow_call:

jobs:
  appimage:
    name: Linux-x86_64-AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install dependencies (apt + source-built libs)
        run: |
          ./CI/appimage_x86_64/install_deps.sh \
            install_apt_pkgs install_gtkdatabox install_libserialport \
            install_libiio install_libad9361 install_libad9166

      - name: Build osc
        run: ./CI/appimage_x86_64/build_osc.sh

      - name: Create AppImage
        run: |
          ./CI/appimage_x86_64/create_appimage.sh \
            get_tools create_appdir create_appimage move_appimage

      - name: Upload AppImage
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Linux-x86_64-AppImage
          path: ADI_IIO_Oscilloscope-x86_64.AppImage
          if-no-files-found: error
