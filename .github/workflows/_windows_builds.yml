name: Windows Builds
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      libiio-branch:
        type: string
        default: "libiio-v0"
      libad9361-branch:
        type: string
        default: "main"
      libad9166-branch:
        type: string
        default: "main"
jobs:
  windows:
    name: ${{ matrix.artifact-name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      LIBIIO_BRANCH: ${{ inputs.libiio-branch || 'libiio-v0' }}
      LIBAD9361_BRANCH: ${{ inputs.libad9361-branch || 'main' }}
      LIBAD9166_BRANCH: ${{ inputs.libad9166-branch || 'main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact-name: Windows-2022-x64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0            # tags needed for `git describe`

      - name: Setup MSYS2 (MINGW64)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            git wget base-devel
            mingw-w64-x86_64-gcc mingw-w64-x86_64-gdb
            mingw-w64-x86_64-cmake mingw-w64-x86_64-make
            mingw-w64-x86_64-autotools mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-dlfcn mingw-w64-x86_64-libserialport
            mingw-w64-x86_64-libusb mingw-w64-x86_64-matio
            mingw-w64-x86_64-fftw mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-glib2 mingw-w64-x86_64-jansson
            mingw-w64-x86_64-python3 mingw-w64-x86_64-doxygen
            mingw-w64-x86_64-tools

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Set version
        run: |
          git config --global --add safe.directory '*'
          OSC_BUILD_VER=$(git describe --tags --always HEAD)
          sed "s/UNSET_VERSION/${OSC_BUILD_VER}/" osc.iss > updated-osc.iss

      - name: Build ADI deps from source (libiio, libad9361, libad9166, gtkdatabox)
        run: |
          export WORKDIR="${RUNNER_TEMP}"
          ./CI/docker/build_mingw.sh build_deps

      - name: Build osc
        run: |
          export SRCDIR="$(pwd)"
          ./CI/docker/build_mingw.sh build_osc

      - name: Assemble install tree
        run: |
          export SRCDIR="$(pwd)"
          ./CI/docker/install_prep.sh

      - name: Package installer (Inno Setup)
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Qp updated-osc.iss'

      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: artifact/adi-osc-setup.exe
          if-no-files-found: error
