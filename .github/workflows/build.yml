name: Build and Deploy iio-oscilloscope

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'staging/*'
      - '20*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - '20*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build-type: ${{ steps.set.outputs.build-type }}
      is-v0: ${{ steps.set.outputs.is-v0 }}
      is-release: ${{ steps.set.outputs.is-release }}
      cloudsmith-version: ${{ steps.set.outputs.cloudsmith-version }}
    steps:
      - id: set
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "build-type=Release" >> "${GITHUB_OUTPUT}"
            echo "is-release=true" >> "${GITHUB_OUTPUT}"
            echo "cloudsmith-version=iio-oscilloscope-${GITHUB_REF#refs/tags/}" >> "${GITHUB_OUTPUT}"
          else
            echo "build-type=RelWithDebInfo" >> "${GITHUB_OUTPUT}"
            echo "is-release=false" >> "${GITHUB_OUTPUT}"
          fi
          # O2: nightly / "v0" publish branch is main for this repo.
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "is-v0=true" >> "${GITHUB_OUTPUT}"
            echo "cloudsmith-version=iio-oscilloscope-v0~latest" >> "${GITHUB_OUTPUT}"
          else
            echo "is-v0=false" >> "${GITHUB_OUTPUT}"
          fi

  linux:
    needs: setup
    uses: ./.github/workflows/_linux_builds.yml
    with:
      build-type: ${{ needs.setup.outputs.build-type }}
    secrets: inherit

  arm:
    needs: setup
    uses: ./.github/workflows/_arm_builds.yml
    with:
      build-type: ${{ needs.setup.outputs.build-type }}
    secrets: inherit

  macos:
    needs: setup
    uses: ./.github/workflows/_macOS_builds.yml
    with:
      build-type: ${{ needs.setup.outputs.build-type }}
    secrets: inherit

  windows:
    needs: setup
    uses: ./.github/workflows/_windows_builds.yml
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Verify every platform produced a non-empty artifact
  # ---------------------------------------------------------------------------
  check-artifacts:
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      (needs.setup.outputs.is-v0 == 'true' || needs.setup.outputs.is-release == 'true')
    needs: [setup, linux, arm, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
      - name: Check artifacts non-empty
        run: |
          set -e
          MISSING=0
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            count=$(find "$dir" -type f | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "EMPTY: $name"; MISSING=$((MISSING + 1))
            else
              echo "OK: $name ($count file(s))"
            fi
          done
          find artifacts -type f | sort | tee artifact_manifest.txt
          echo "Total: $(wc -l < artifact_manifest.txt) files"
          if [ "$MISSING" -gt 0 ]; then echo "ERROR: $MISSING artifact(s) empty"; exit 1; fi
      - name: Upload manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Artifact-manifest
          path: artifact_manifest.txt

  # ---------------------------------------------------------------------------
  # Publish artifacts to Cloudsmith (test repo during migration)
  # ---------------------------------------------------------------------------
  push-cloudsmith:
    if: needs.setup.outputs.is-v0 == 'true' || needs.setup.outputs.is-release == 'true'
    needs: [setup, check-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ github.workspace }}/artifacts
      - name: Install Cloudsmith CLI
        run: pip install cloudsmith-cli
      - name: Upload to Cloudsmith
        env:
          # TODO(production): switch secret to CLOUDSMITH_API_KEY
          CLOUDSMITH_API_KEY: ${{ secrets.TEST_REPO_CLOUDSMITH_TOKEN }}
        run: |
          set -e
          VERSION="${{ needs.setup.outputs.cloudsmith-version }}"
          ART="${{ github.workspace }}/artifacts"
          for dir in "${ART}"/*/; do
            tag=$(basename "${dir}")
            [[ "${tag}" == "Artifact-manifest" ]] && continue
            # TODO(production): push to adi/external instead of adi/test-alin-repo
            if [[ "${tag}" == Windows-* ]]; then
              (cd "${ART}" && zip -r "${tag}.zip" "${tag}" && rm -r "${tag}" \
                && cloudsmith push raw --republish --tags "${tag}" --version "${VERSION}" \
                     adi/test-alin-repo "${tag}.zip" \
                && rm "${tag}.zip")
              continue
            fi
            for file in "${dir}"*; do
              [[ -f "${file}" ]] || continue
              filename=$(basename "${file}")
              # Strip the git hash (.g<hex>) so the name is stable across commits.
              stable=$(echo "${filename}" | sed 's/\.g[0-9a-f]\+//')
              cloudsmith push raw --republish --tags "${tag}" --version "${VERSION}" \
                adi/test-alin-repo "${file}"
            done
          done

  # ---------------------------------------------------------------------------
  # Draft GitHub Release on version tags
  # ---------------------------------------------------------------------------
  push-github-release:
    if: needs.setup.outputs.is-release == 'true'
    needs: [setup, check-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ github.workspace }}/artifacts
      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          name: "iio-oscilloscope ${{ github.ref_name }}"
          files: ${{ github.workspace }}/artifacts/*
          generate_release_notes: true
