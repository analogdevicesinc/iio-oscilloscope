name: Build
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'ci/*'
      - 'staging/*'
      - '20*'
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
      - '.gitignore'
      - 'LICENSE*'
      - 'COPYING*'
      - 'CODE_OF_CONDUCT*'
      - 'CONTRIBUTING*'
  pull_request:
    branches:
      - main
      - next_stable
      - libad9166-iio-v0
      - '20*'

    paths-ignore:
      - '**/*.md'
      - 'doc/**'
      - '.gitignore'
      - 'LICENSE*'
      - 'COPYING*'
      - 'CODE_OF_CONDUCT*'
      - 'CONTRIBUTING*'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build-type: ${{ steps.set.outputs.build-type }}
      is-release: ${{ steps.set.outputs.is-release }}
      is-main: ${{ steps.set.outputs.is-main }}
      cloudsmith-version: ${{ steps.set.outputs.cloudsmith-version }}
    steps:
      - id: set
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "build-type=Release" >> "$GITHUB_OUTPUT"
            echo "is-release=true" >> "$GITHUB_OUTPUT"
            echo "cloudsmith-version=iio-oscilloscope-${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "build-type=RelWithDebInfo" >> "$GITHUB_OUTPUT"
            echo "is-release=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo "is-main=true" >> "$GITHUB_OUTPUT"
            echo "cloudsmith-version=iio-oscilloscope-main~latest" >> "$GITHUB_OUTPUT"
          else
            echo "is-main=false" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: setup
    uses: ./.github/workflows/_linux-builds.yml
    with:
      build-type: ${{ needs.setup.outputs.build-type }}
    secrets:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_TOKEN }}

  arm:
    needs: setup
    uses: ./.github/workflows/_arm-builds.yml
    with:
      build-type: ${{ needs.setup.outputs.build-type }}
    secrets:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_TOKEN }}

  macos:
    needs: setup
    uses: ./.github/workflows/_macos-builds.yml
    with:
      build-type: ${{ needs.setup.outputs.build-type }}
    secrets:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_TOKEN }}

  windows:
    needs: setup
    uses: ./.github/workflows/_windows-builds.yml
    with:
      build-type: ${{ needs.setup.outputs.build-type }}
    secrets:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_TOKEN }}
  appimage:
    needs: setup
    uses: ./.github/workflows/_appimage-builds.yml

  #############################################
  # Check Artifacts
  #############################################
  check-artifacts:
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      (needs.setup.outputs.is-main == 'true' || needs.setup.outputs.is-release == 'true')
    needs: [setup, linux, arm, macos, windows, appimage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
      - name: Check artifacts are non-empty
        run: |
          set -e
          MISSING=0
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            count=$(find "$dir" -type f | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "EMPTY: $name"
              MISSING=$((MISSING + 1))
            else
              echo "OK: $name ($count file(s))"
            fi
          done
          echo ""
          find artifacts -type f | sort | tee artifact_manifest.txt
          echo ""
          echo "Total: $(wc -l < artifact_manifest.txt) files"
          if [ "$MISSING" -gt 0 ]; then
            echo "ERROR: $MISSING artifact(s) empty"
            exit 1
          fi

      - name: Upload manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Artifact-manifest
          path: artifact_manifest.tx

#############################################
# Push to Cloudsmith
#############################################
  push-cloudsmith:
    if: needs.setup.outputs.is-main == 'true' || needs.setup.outputs.is-release == 'true'
    needs: [setup, check-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
      - name: Install Cloudsmith CLI
        run: pip install cloudsmith-cli
      - name: Upload to Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_TOKEN }}
        run: |
          set -e
          VERSION="${{ needs.setup.outputs.cloudsmith-version }}"
          for dir in artifacts/*/; do
            tag=$(basename "$dir")
            [ "$tag" = "Artifact-manifest" ] && continue
            if [ "$(find "$dir" -type f | wc -l)" -eq 1 ]; then
              # Single distributable (e.g. AppImage): push as-is.
              cloudsmith push raw --republish \
                --tags "$tag" --version "$VERSION" \
                adi/external "$(find "$dir" -type f)"
            else
              # Multi-file build tree: push one zip per artifact.
              ( cd artifacts && zip -qr "$tag.zip" "$tag" )
              cloudsmith push raw --republish \
                --tags "$tag" --version "$VERSION" \
                adi/external "artifacts/$tag.zip"
              rm "artifacts/$tag.zip"
            fi
          done

  #############################################
  # Push to GitHub Release
  #############################################
  push-github-release:
    if: needs.setup.outputs.is-release == 'true'
    needs: [setup, check-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ github.workspace }}/artifacts

      - name: Prepare assets for release
        run: ./CI/prepare_assets.sh release
        env:
          BUILD_SOURCESDIRECTORY: ${{ github.workspace }}
          BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}/artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          name: "iio-oscilloscope release ${{ github.ref_name }}"
          files: ${{ github.workspace }}/artifacts/*
          generate_release_notes: true
