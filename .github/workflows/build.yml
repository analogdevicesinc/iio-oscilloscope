name: Build

# Azure Pipelines -> GitHub Actions migration (modular).
# setup computes build flags, fans out to the per-platform reusable workflows,
# then (on main / release tags) checks artifacts, pushes to Cloudsmith and cuts
# a draft GitHub Release. macOS is compile-verify only and never gates publish.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'staging/*'
      - '20*'
      - 'test/*'          # TODO: remove before merging (lets this branch run)
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - '20*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build-type: ${{ steps.set.outputs.build-type }}
      is-release: ${{ steps.set.outputs.is-release }}
      is-main: ${{ steps.set.outputs.is-main }}
      cloudsmith-version: ${{ steps.set.outputs.cloudsmith-version }}
    steps:
      - id: set
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "build-type=Release" >> "$GITHUB_OUTPUT"
            echo "is-release=true" >> "$GITHUB_OUTPUT"
            echo "cloudsmith-version=iio-oscilloscope-${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "build-type=RelWithDebInfo" >> "$GITHUB_OUTPUT"
            echo "is-release=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo "is-main=true" >> "$GITHUB_OUTPUT"
            echo "cloudsmith-version=iio-oscilloscope-main~latest" >> "$GITHUB_OUTPUT"
          else
            echo "is-main=false" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: setup
    uses: ./.github/workflows/_linux-builds.yml
    with:
      build-type: ${{ needs.setup.outputs.build-type }}
    secrets:
      # TODO(production): switch to CLOUDSMITH_API_KEY
      CLOUDSMITH_API_KEY: ${{ secrets.TEST_REPO_CLOUDSMITH_TOKEN }}

  arm:
    needs: setup
    uses: ./.github/workflows/_arm-builds.yml
    with:
      build-type: ${{ needs.setup.outputs.build-type }}
    secrets:
      CLOUDSMITH_API_KEY: ${{ secrets.TEST_REPO_CLOUDSMITH_TOKEN }}

  macos:
    needs: setup
    uses: ./.github/workflows/_macos-builds.yml
    with:
      build-type: ${{ needs.setup.outputs.build-type }}
    secrets:
      CLOUDSMITH_API_KEY: ${{ secrets.TEST_REPO_CLOUDSMITH_TOKEN }}

  windows:
    needs: setup
    uses: ./.github/workflows/_windows-builds.yml
    with:
      build-type: ${{ needs.setup.outputs.build-type }}
    secrets:
      CLOUDSMITH_API_KEY: ${{ secrets.TEST_REPO_CLOUDSMITH_TOKEN }}

  appimage:
    needs: setup
    uses: ./.github/workflows/_appimage-builds.yml

  # macOS deliberately excluded: compile-verify only, must not block publish.
  check-artifacts:
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      (needs.setup.outputs.is-main == 'true' || needs.setup.outputs.is-release == 'true')
    needs: [setup, linux, arm, windows, appimage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
      - name: Check artifacts are non-empty
        run: |
          set -e
          missing=0
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            count=$(find "$dir" -type f | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "EMPTY: $name"; missing=$((missing + 1))
            else
              echo "OK: $name ($count file(s))"
            fi
          done
          [ "$missing" -eq 0 ] || { echo "ERROR: $missing artifact(s) empty"; exit 1; }

  push-cloudsmith:
    if: needs.setup.outputs.is-main == 'true' || needs.setup.outputs.is-release == 'true'
    needs: [setup, check-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
      - name: Install Cloudsmith CLI
        run: pip install cloudsmith-cli
      - name: Upload to Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.TEST_REPO_CLOUDSMITH_TOKEN }}
        run: |
          set -e
          VERSION="${{ needs.setup.outputs.cloudsmith-version }}"
          for dir in artifacts/*/; do
            tag=$(basename "$dir")
            for file in "$dir"*; do
              [ -f "$file" ] || continue
              cloudsmith push raw --republish \
                --tags "$tag" --version "$VERSION" \
                adi/external "$file"
            done
          done

  push-github-release:
    if: needs.setup.outputs.is-release == 'true'
    needs: [setup, check-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          name: "iio-oscilloscope ${{ github.ref_name }}"
          files: release/*
          generate_release_notes: true
